name: Liquid Glass Skill validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-package:
    name: Validate Skill package and platform workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python -m py_compile .agents/skills/liquid-glass/scripts/inspect_project.py
          python -m py_compile .agents/skills/liquid-glass/tests/test_skill_package.py
          python -m py_compile studio/scripts/build_plugin_package.py
          python -m py_compile studio/tests/test_studio_package.py
          python -m py_compile examples/tests/test_reference_demos.py
          python -m py_compile examples/tests/test_phase6_validation.py

      - name: Run Skill package and platform adaptation tests
        run: python -m unittest discover -s .agents/skills/liquid-glass/tests -v

      - name: Run Liquid Glass Studio package tests
        run: python -m unittest discover -s studio/tests -v

      - name: Build private Studio plugin archive
        run: python studio/scripts/build_plugin_package.py --output /tmp/liquid-glass-studio.zip

      - name: Upload private Studio plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-studio-plugin
          path: /tmp/liquid-glass-studio.zip
          if-no-files-found: error
          retention-days: 3

      - name: Run runnable reference demo contract tests
        run: python -m unittest discover -s examples/tests -v

      - name: Run read-only project inventory smoke test
        run: |
          python .agents/skills/liquid-glass/scripts/inspect_project.py .
          python studio/scripts/build_plugin_package.py --check
