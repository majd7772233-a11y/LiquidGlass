name: Liquid Glass Skill validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-package:
    name: Validate Skill package and platform workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python -m py_compile .agents/skills/liquid-glass/scripts/inspect_project.py
          python -m py_compile .agents/skills/liquid-glass/tests/test_skill_package.py

      - name: Run Skill package and platform adaptation tests
        run: python -m unittest discover -s .agents/skills/liquid-glass/tests -v

      - name: Run read-only project inventory smoke test
        run: python .agents/skills/liquid-glass/scripts/inspect_project.py .
