name: Liquid Glass runnable reference demos

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - ".github/workflows/reference-demos.yml"
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/reference-demos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webgl2:
    name: Build and exercise WebGL2 L2/L3 demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser test dependency
        working-directory: examples/webgl2
        run: npm install --no-audit --no-fund

      - name: Install Chromium and system dependencies
        working-directory: examples/webgl2
        run: npx playwright install --with-deps chromium

      - name: Run WebGL2 browser smoke test and capture reference images
        working-directory: examples/webgl2
        run: npm test

      - name: Upload WebGL2 captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-webgl2-captures
          path: examples/webgl2/artifacts/
          if-no-files-found: warn
          retention-days: 14

  android-gles2:
    name: Build and launch Android Java/GLES2 demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure the runner Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble Android debug APK
        working-directory: examples/android-gles
        run: gradle --no-daemon :app:assembleDebug

      - name: Validate emulator verification script
        run: bash -n examples/android-gles/scripts/verify-emulator.sh

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on Android API 35 emulator and capture L3
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash examples/android-gles/scripts/verify-emulator.sh

      - name: Upload Android APK and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-android-gles2
          path: |
            examples/android-gles/app/build/outputs/apk/debug/app-debug.apk
            artifacts/
          if-no-files-found: warn
          retention-days: 14
