name: Liquid Glass runnable reference demos

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - ".github/workflows/reference-demos.yml"
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/reference-demos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webgl2:
    name: Build and exercise WebGL2 L2/L3 demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser test dependency
        working-directory: examples/webgl2
        run: npm install --no-audit --no-fund

      - name: Install Chromium and system dependencies
        working-directory: examples/webgl2
        run: npx playwright install --with-deps chromium

      - name: Run WebGL2 browser smoke test and capture reference images
        working-directory: examples/webgl2
        run: npm test

      - name: Upload WebGL2 captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-webgl2-captures
          path: examples/webgl2/artifacts/
          if-no-files-found: warn
          retention-days: 14

  android-gles2:
    name: Build and launch Android Java/GLES2 demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure the runner Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble Android debug APK
        working-directory: examples/android-gles
        run: gradle --no-daemon :app:assembleDebug

      - name: Launch on Android API 35 emulator and capture L3
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p artifacts
            adb logcat -c
            adb install -r examples/android-gles/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n org.liquidglass.reference.debug/org.liquidglass.reference.MainActivity

            READY=0
            for attempt in $(seq 1 35); do
              if adb logcat -d -s LiquidGlassDemo:I | grep -q "GL_READY tier=L3 renderer=GLES2_APP_OWNED_FBO"; then
                READY=1
                break
              fi
              sleep 2
            done

            adb logcat -d -s LiquidGlassDemo:I > artifacts/android-gl.log
            adb shell uiautomator dump /sdcard/liquid-glass-window.xml >/dev/null
            adb pull /sdcard/liquid-glass-window.xml artifacts/android-window.xml

            python3 - <<'PY'
            import re
            import subprocess
            import xml.etree.ElementTree as ET

            tree = ET.parse("artifacts/android-window.xml")
            nodes = list(tree.iter("node"))
            target = next((node for node in nodes if node.attrib.get("text") == "Connect lens"), None)
            if target is None:
                raise SystemExit("The native Connect lens control was not present in the accessibility tree.")
            match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", target.attrib["bounds"])
            if not match:
                raise SystemExit("Could not parse Android accessibility bounds for Connect lens.")
            left, top, right, bottom = map(int, match.groups())
            subprocess.run(["adb", "shell", "input", "tap", str((left + right) // 2), str((top + bottom) // 2)], check=True)
            PY

            sleep 2
            adb shell screencap -p /sdcard/liquid-glass-android-l3.png
            adb pull /sdcard/liquid-glass-android-l3.png artifacts/android-gles2-l3.png

            test "$READY" = "1" || { echo "Android GL did not reach the GLES2 app-owned framebuffer path."; cat artifacts/android-gl.log; exit 1; }
            grep -q "GL_READY tier=L3 renderer=GLES2_APP_OWNED_FBO" artifacts/android-gl.log
            test -s artifacts/android-gles2-l3.png

      - name: Upload Android APK and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-android-gles2
          path: |
            examples/android-gles/app/build/outputs/apk/debug/app-debug.apk
            artifacts/
          if-no-files-found: warn
          retention-days: 14
